models:
  # Opus 5.5 (released 2026-09-22): $4.00/$20.00, ~40% cheaper on typical
  # workloads and >30% faster than Opus 5. cache_write is the 5-minute cache
  # rate (1.25x input), matching the 5.00 reported for a 5-min cache write.
  claude-opus-5-5:
    input: 4.00
    cache_write: 5.00
    cache_read: 0.20
    output: 20.00
    context_window: 1000000
    properties:
      fs:
        available: false
        values: ["na"]
        default: "na"
