# Codex-native model catalog (capability + context for C5 / context bar).
# Installed overlay: .workflow-hero/models/codex.yml
# Model IDs match Codex app-server ListModels (PRD-C06-001 §4.8; design D12).
# Pricing from https://developers.openai.com/api/docs/pricing (Standard short-context, 2026-08-25).
# For GPT-5.6 tiers cache_write is 1.25x input (OpenAI prompt-cache write surcharge).
# Long-context (>272K input) is 2x input / 1.5x output for the full request — not modeled here.
# Context: Codex default window is ~272k; API max may be higher (1.05M/400K) — see model pages.
