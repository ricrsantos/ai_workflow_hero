provider: cursor
version: 1
last_updated: 2026-08-21
currency: usd
unit: per_1m_tokens

# C5 property metadata is defined on base model rows. Variant slugs such as
# cursor-grok-4.6-low or composer-2.5-fast inherit properties via catalog
# base-slug lookup (ADR-039).

models:
  # Cursor Agent CLI default (`agent models`: "auto - Auto (default)").
  # Pricing = Auto Cost flat rates (docs: $1.25 input+cache write / $0.25 cache
  # read / $6.00 output per 1M tokens), regardless of which model the router
  # picks. Balance/Intelligence bill at the routed model's API rates instead.
  # context_window uses the Grok 4.5 pool floor (required router model); the
  # effective window still depends on the model chosen for each request.
  # No CLI variant slugs (auto-fast / effort) → C5 properties unavailable.
  auto:
    input: 1.25
    cache_write: 1.25
    cache_read: 0.25
    output: 6.00
    context_window: 500000
    properties:
      fs:
        available: false
        values: ["na"]
        default: "na"
      ef:
        available: false
        values: ["na"]
        default: "na"
      th:
        available: false
        values: ["na"]
        default: "na"
  composer-2.5:
    input: 0.50
    cache_write: 0.00
    cache_read: 0.20
    output: 2.50
    context_window: 200000
    properties:
      fs:
        available: true
        values: ["true", "false"]
        default: "false"
      ef:
        available: false
        values: ["na"]
        default: "na"
      th:
        available: false
        values: ["na"]
        default: "na"
  composer-2.5-fast:
    input: 3.00
    cache_write: 0.00
    cache_read: 0.50
    output: 15.00
    context_window: 200000
  # Cursor IDE / Task slug for Grok 4.5 (Cursor-published rates).
  cursor-grok-4.5:
    input: 2.00
    cache_write: 0.00
    cache_read: 0.50
    output: 6.00
    context_window: 500000
    properties:
      fs:
        available: true
        values: ["true", "false"]
        default: "false"
      ef:
        available: true
        values: ["high"]
        default: "high"
      th:
        available: false
        values: ["na"]
        default: "na"
  cursor-grok-4.5-high:
    input: 2.00
    cache_write: 0.00
    cache_read: 0.50
    output: 6.00
    context_window: 500000
  cursor-grok-4.5-high-fast:
    input: 4.00
    cache_write: 0.00
    cache_read: 1.00
    output: 12.00
    context_window: 500000
  cursor-grok-4.6:
    input: 2.00
    cache_write: 0.00
    cache_read: 0.50
    output: 6.00
    context_window: 500000
    properties:
      fs:
        available: true
        values: ["true", "false"]
        default: "false"
      ef:
        available: true
        values: ["low", "medium", "high", "xhigh"]
