# Claude Code-native local catalog (C13 / ADR-074).
# These are CLI selectors, not Anthropic API provider aliases. Pricing is
# deliberately omitted: Claude Code subscription/account billing must never be
# inferred as token pricing by Hero. The aliases and pinned IDs below follow
# Claude Code's native model configuration documentation.
#
# Context windows are Claude Code's, not the Anthropic API's — they differ.
# Claude Code documents Haiku at 100K while the API exposes 200K for the same
# model, so these values must come from Claude Code's model-config docs.
#
# The current generation is natively 1M: Fable 5.1, Opus 5, Sonnet 5, and
# Opus 4.7+. `[1m]` remains only for the selectors whose resolved model is not
# natively 1M (Sonnet 4.6, Opus 4.6), where Claude Code documents the suffix as
# an extended-context opt-in.
provider: claude
version: 1
last_updated: 2026-09-25
currency: usd
unit: per_1m_tokens

# Claude uses the explicitly labeled degraded file-reference path in this
# cycle. The adapter still verifies the selected native selector locally.
media:
  image_input_file_reference: true
  image_output_file: true
  max_attachment_bytes: 20971520

models:
  # Aliases resolve to the current generation, which is natively 1M.
  sonnet: &native_1m
    context_window: 1000000
    properties: &standard_properties
      fs:
        available: false
        values: ["na"]
        default: "na"
      th:
        available: false
        values: ["na"]
        default: "na"
      ef:
        available: true
        values: ["low", "medium", "high"]
        default: "medium"
  sonnet[1m]:
    <<: *native_1m
  claude-sonnet-5:
    <<: *native_1m
  # Sonnet 4.6 is one of the two selectors that is still 200K natively, so the
  # `[1m]` suffix is a real opt-in here rather than a no-op.
  claude-sonnet-4-6:
    context_window: 200000
    properties: *standard_properties
  claude-sonnet-4-6[1m]:
    <<: *native_1m

  # Opus 5.5 (released 2026-09-22) is Claude Code's `opus` alias default from
  # CLI 2.1.280+ (natively 1M, same shape as claude-opus-5).
  opus:
    <<: *native_1m
  opus[1m]:
    <<: *native_1m
  claude-opus-5-5:
    <<: *native_1m
  claude-opus-5:
    <<: *native_1m
  claude-opus-4-7:
    <<: *native_1m
  claude-opus-4-7[1m]:
    <<: *native_1m

  # Claude Code documents Haiku at 100K, below the API's 200K for this model.
  haiku: &haiku
    context_window: 100000
    properties: *standard_properties
  claude-haiku-4-5-20251001:
    <<: *haiku

  fable:
    <<: *native_1m
  claude-fable-5-1:
    <<: *native_1m
  claude-fable-5:
    <<: *native_1m
