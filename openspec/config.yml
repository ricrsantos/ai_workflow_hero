  Authoritative C16 sources: PRD-C16-001 §§1–7, UI-C16-001 §§1–10, and ADR-091–098.
  Idea notes yield on divergence. Schema v12 is forward-only from v11; never recreate hero.db.
  Browser UI Validation and QA End-to-End are disabled for this cycle. Scope is native=true → generic_agent.

  Planning decisions locked for this change:
    - Opaque Hero session UUID is the History key; native IDs are harness-scoped attributes.
    - Audit `conversation` table stays; user-visible events live in `session_events`.
    - Lease heartbeat 5s / TTL 30s with injected-clock CAS; listing needs no lease.
    - Fork context is deterministic newest-first user+assistant text bounded to 32 KiB; no LLM.
    - C14 registered session dirs survive until explicit delete; originals are never unlinked.
    - Optional RemoteHistoryReader / NativeSessionDeleter; C16 adapters do not invent delete support.
    - Cycle/stage session columns are compatibility projections, not the aggregate key.

  Stack: Go, Cobra, embed.FS, Feature Based + Vertical Slice, Bubble Tea/lipgloss/bubbles, SQLite.
  Test command: `go test ./...`. Active OpenSpec change: `tui-session-history`.
  Engineering guidance: idiomatic Go, small injectable components, explicit wrapped errors,
  context cancellation, no global mutable state; TUI Update/View never block; real temp SQLite
  and t.TempDir() media roots; injected clocks; no live harness accounts.

rules:
  proposal:
    - Reference PRD-C16-001 sections; cite ADR-091–098 and UI-C16-001
    - State in/out of scope; idea notes yield to PRD/UI/ADR
    - Classify CLI versus Runtime work per ADR-003; no new session CRUD CLI verbs in C16
    - Call out schema v12, leases, exact resume/fork, and durable asset retention

  specs:
    - Use WHEN/THEN acceptance scenarios with exactly four hashtags for `#### Scenario:`
    - Align with PRD-C16-001, UI-C16-001, ADR-091–098, and existing store/conversation/TUI contracts
    - Specify observable lifecycle and diagnostic behavior without prescribing incidental Go internals
    - Mark filesystem, clock, and SQLite as real temporary fixtures

  design:
    - Follow ADR-002, ADR-003, ADR-012, ADR-013, ADR-061, ADR-080, ADR-091–098 and existing vertical-slice boundaries
    - Keep conversation service free of Bubble Tea/Telegram types; TUI I/O is tea.Cmd only
    - Keep audit conversation distinct from session_events; History must not CASCADE-delete with cycles
    - Prefer parallel store slices and adapter capability work after schema exists; TUI waits on the service

  tasks:
    - Use atomic `- [ ] X.Y [task-id] [agent:generic_agent]` checklist items with PARALLEL/SERIES markers
    - Scope all implementation to native → `generic_agent`; colocate behavior tests; require `go test ./...`
    - Do not start History UI work before stable service contracts; do not mark lifecycle complete before v12/lease/delete tests
    - Fan out History screen, Chat persist, and adapter capability work after the session service exists
