schema: spec-driven

context: |
  Project: AI Workflow Hero (Hero) — the Hero CLI + Runtime assets themselves.
  This is Hero's own source code repository, not a project that consumes Hero.
  Phase: Cycle C3 — Cursor Harness Autonomy & TUI Orchestration.

  Authoritative sources — read before planning or writing any artifact:
    - AGENTS.md (project summary, doc map, reference lookup order, testing loop, ambiguity policy)
    - docs/product/PRD.md (baseline index; cycle PRDs supersede on conflict)
    - docs/architecture/ADR.md (ADR-001–011 index + Appendix schemas; cycle ADRs linked)
    - docs/deployment/DEPLOY.md (Build, Release, and Distribution (updated for 1.0 upgrade))
    - docs/product/UI.md (CLI/TUI visual conventions index)
    - context/current-state.md (current implementation status, architecture summary, pending features)
    - context/context-log.md (recent decisions and session history)
    - Cycle documents (from .workflow-hero/config/documents.json):
      - docs/product/PRD-C01-001-hero-1-0.md — Hero 1.0 (PRD)
      - docs/architecture/ADR-C01-001-hero-1-0.md — Hero 1.0 ADRs (ADR)
      - docs/product/UI-C01-001-hero-tui.md — Hero 1.0 TUI (UI)
      - docs/product/PRD-C02-001-slash-parity-tui-harness.md — C2 slash parity (PRD)
      - docs/architecture/ADR-C02-001-slash-parity-harness-archive.md — ADR-020–023 (ADR)
      - docs/product/UI-C02-001-tui-slash-command-parity.md — C2 TUI (UI)
      - docs/product/PRD-C03-001-cursor-harness-tui-autonomy.md — C3 harness autonomy (PRD)
      - docs/architecture/ADR-C03-001-cursor-harness-tui-autonomy.md — ADR-024–029 (ADR)
      - docs/product/UI-C03-001-tui-harness-autonomy.md — C3 TUI conversation UX (UI)
    - docs/idea/archive/v1/06_harness_adapter.md, 07_cursor_adapter.md (design reference; non-normative)

  Terminology: **etapa** = workflow stage; **interação** = one conversational round within an etapa.

  Do not invent requirements. Respect Deferred D1 multi-harness adapters, IDE chat injection,
  Go LLM reasoning, and Windows. Scope: native=true (generic_agent).

  Stack: Go, Cobra, embed.FS, Feature Based + Vertical Slice, huh + Bubble Tea, SQLite (ADR-013).
  Test command: `go test ./...`. Active OpenSpec change: `cursor-harness-tui-autonomy`.

rules:
  proposal:
    - Reference PRD-C03-001 sections; cite ADR-024–029
    - State in/out of scope; exclude D1, IDE inject, Go LLM, Windows
    - Classify CLI vs Runtime per ADR-003

  specs:
    - Use WHEN/THEN acceptance scenarios (exactly 4 hashtags for `#### Scenario:`)
    - Align with PRD-C03-001 and UI-C03-001

  design:
    - Follow ADR-002, ADR-003, ADR-024–029; layer separation: only cursor adapter execs CLI

  tasks:
    - Atomic checklist; `go test ./...`; mark PARALLEL vs SERIES
    - Scope native → generic_agent; colocated _test.go per package touched
