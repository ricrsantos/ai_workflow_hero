  Terminology: **etapa** = workflow stage; **interação** = one conversational round within an etapa;
  **enabled** = user selected harness in hero.json; **available** = adapter IsAvailable true;
  **native model id** = harness-specific model string (Cursor slug, OpenCode provider/model, Codex native id);
  **managed field** = YAML path owned by the Config screen (PRD-C07-001 §4.2); all other YAML is unmanaged.

  Authoritative C7 sources: PRD-C07-001, UI-C07-001, ADR-049–053. The idea file yields on divergence.
  External-edit UX is ADR-050 (no reload/merge/cancel dialog): Save loads the latest valid file and applies
  the TUI draft only to managed paths. Existing `internal/workflowconfig` Document scaffolding must be
  aligned to that rule (current revision-mismatch rejection is not the approved behavior).

  Do not invent requirements. Preserve Cursor IDE Runtime, C4/C5/C6 harness behavior, checksum upgrade,
  dual-entry, lazy harness boot, C5 model properties, and deterministic engine. No hero serve daemon.
  Scope: native=true (generic_agent). Browser UI Validation and QA End-to-End are disabled for C7.

  Stack: Go, Cobra, embed.FS, Feature Based + Vertical Slice, huh + Bubble Tea (existing charmbracelet/bubbletea import; do not migrate to v2), SQLite (ADR-013).
  Test command: `go test ./...`. Active OpenSpec change: `tui-cycle-config`.
  TUI skill: golang-tui Elm Architecture — WindowSizeMsg, key.Matches, tea.Cmd for I/O, strings.Builder, Lip Gloss/ANSI width.

rules:
  proposal:
    - Reference PRD-C07-001 sections; cite ADR-049–053 and UI-C07-001
    - State in/out of scope; idea file yields to PRD/UI/ADR; ADR-050 supersedes idea-file conflict dialog
    - Classify CLI vs Runtime per ADR-003; Cursor IDE stays unchanged
    - Reuse internal/workflowconfig, modelprops, harnessmgr; do not write cycle config to hero.json

  specs:
    - Use WHEN/THEN acceptance scenarios (exactly 4 hashtags for `#### Scenario:`)
    - Align with PRD-C07-001, UI-C07-001, and ADR-049–053

  design:
    - Follow ADR-002, ADR-003, ADR-049–053; YAML node merge stays in internal/workflowconfig
    - Config is an Elm Architecture child screen; I/O never blocks Update (ADR-053)
    - Reuse C5 catalogs/capability snapshots; persist properties to YAML agent blocks only

  tasks:
    - Atomic checklist; `go test ./...`; mark PARALLEL vs SERIES
    - Scope native → generic_agent; colocated _test.go per package touched
    - Keep document merge, engine retry, and TUI form as standalone tracks after the document API
