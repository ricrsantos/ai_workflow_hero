  Terminology: **etapa** = workflow stage; **interação** = one conversational round within an etapa;
  **daemon** = local OS-user Telegram Bot API owner; **address** = project abbreviation with optional `_N` suffix or `free_N`;
  **pending message** = durable queue row awaiting TUI delivery (24h TTL).

  Authoritative C9 sources: PRD-C09-001, UI-C09-001, ADR-059–064. Idea file yields on divergence
  (notably: Bot API is daemon-owned with IPC push, not per-TUI polling or Runtime-owned API).
  Conversation core MUST be extracted before Telegram wiring (ADR-061). Credentials ONLY in OS vault (ADR-062).

  Do not invent requirements. Preserve Cursor IDE Runtime, C4–C8 harness/TUI behavior, checksum upgrade,
  dual-entry, timers (ADR-058), and deterministic engine. Scope: native=true (generic_agent).
  Browser UI Validation and QA End-to-End disabled for C9.

  Stack: Go, Cobra, embed.FS, Feature Based + Vertical Slice, huh + Bubble Tea (existing charmbracelet/bubbletea import; do not migrate to v2), SQLite (ADR-013).
  Test command: `go test ./...`. Active OpenSpec change: `telegram-integration`.
  TUI skill: golang-tui Elm Architecture — WindowSizeMsg, key.Matches, tea.Cmd for I/O, strings.Builder, Lip Gloss/ANSI width.

rules:
  proposal:
    - Reference PRD-C09-001 sections; cite ADR-059–064 and UI-C09-001
    - State in/out of scope; idea file yields to PRD/UI/ADR; daemon owns Bot API (not Runtime per-TUI)
    - Classify CLI vs Runtime per ADR-003; Cursor IDE stays unchanged
    - No harness adapter imports of Telegram types; no secrets in SQLite/UI/logs

  specs:
    - Use WHEN/THEN acceptance scenarios (exactly 4 hashtags for `#### Scenario:`)
    - Align with PRD-C09-001, UI-C09-001, and ADR-059–064
    - Mark injectable dependencies for Bot API, vault, clock, IPC, process launcher

  design:
    - Follow ADR-002, ADR-003, ADR-059–064; conversation extraction before Telegram adapter
    - IPC and daemon I/O never block Bubble Tea Update (tea.Cmd)
    - Redaction helper shared across project and daemon logs

  tasks:
    - Atomic checklist; `go test ./...`; mark PARALLEL vs SERIES
    - Scope native → generic_agent; colocated _test.go per package touched
    - Parallel fan-out: log rotation + plugin CLI; Settings + transcript after IPC client
