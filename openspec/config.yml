  Authoritative C14 sources: PRD-C14-001 §§1–5, UI-C14-001 §§1–8, and ADR-077–082.
  The idea file yields on divergence. Multimodal images are Free Chat only; Research and
  workflow-stage sessions stay text-only. Cursor IDE Runtime, deterministic workflow stages,
  Telegram image transport, audio/video/PDF, Windows, and session card reconstruction after
  TUI restart remain out of scope. Browser UI Validation and QA End-to-End are disabled for
  this cycle. Scope is native=true → generic_agent.

  Planning decisions locked for this change:
    - Keymap: Alt+A (file picker) and Alt+V (clipboard attach) are unused in internal/tui;
      keep them. Existing Alt bindings (q/r/i/m/enter/1–7/n/s/u) stay unchanged.
    - Shared contract lives in internal/harness (ADR-077); do not create internal/media yet.
    - Claude: series fixture spike for --input-format stream-json without a real account.
      If native stdin is proven, implement it. If not, ship the labeled file-reference
      degraded path in this cycle (PRD-C14-001 §2.11 / §4). Never silent-drop attachments.
    - Tool-written images (ADR-082): Codex via imageGeneration/imageView (+ path extraction);
      OpenCode via SSE file/image/tool-result parts; Cursor/Claude file-ref via workspace
      FS watch + tool-result path extraction; dedupe by SHA-256 content hash.
    - Unicode mosaic is mandatory; Kitty/Sixel/iTerm2 are optional phase-4, off by default.
    - Apply go-engineering and golang-tui skills; all I/O is tea.Cmd; model holds references only.

  Stack: Go, Cobra, embed.FS, Feature Based + Vertical Slice, Bubble Tea/lipgloss/bubbles, SQLite.
  Test command: `go test ./...`. Active OpenSpec change: `tui-multimodal-images`.
  Engineering guidance: idiomatic Go, small injectable components, explicit wrapped errors,
  context cancellation, no global mutable state; TUI Update/View never block; race tests for
  async workers; fixtures and fake processes only (no live harness accounts).

rules:
  proposal:
    - Reference PRD-C14-001 sections; cite ADR-077–082 and UI-C14-001
    - State in/out of scope; idea file yields to PRD/UI/ADR; Free Chat only
    - Classify CLI versus TUI/runtime work per ADR-003; no Telegram image transport
    - Call out keymap decision (Alt+A/Alt+V), Claude spike-or-degraded path, and tool-asset detection

  specs:
    - Use WHEN/THEN acceptance scenarios with exactly four hashtags for `#### Scenario:`
    - Align with PRD-C14-001, UI-C14-001, ADR-077–082, and existing normalized harness contracts
    - Specify observable security/capability/preview behavior without prescribing Go internals
    - Mark filesystem, clipboard, process, clock, and protocol dependencies as injectable/test fixtures

  design:
    - Follow ADR-002, ADR-003, ADR-031, ADR-077–082 and existing adapter vertical-slice boundaries
    - Keep validation, asset store, and mosaic outside adapters; keep protocol translation adapter-local
    - Make all capture/validate/thumbnail/mosaic/open/save I/O asynchronous tea.Cmd; model stores UUID/path metadata only
    - Prefer parallel adapter work after the shared contract and capability gate exist

  tasks:
    - Use atomic `- [ ] X.Y [task-id] [agent:generic_agent]` checklist items with PARALLEL/SERIES markers
    - Scope all implementation to native → `generic_agent`; colocate behavior tests; require `go test ./...`
    - Gate Claude native work behind the fixture spike; fan out Codex/OpenCode/Cursor adapters after shared contract
    - Mark TUI composer and mosaic work parallel once the Attachment/Asset contract is available
