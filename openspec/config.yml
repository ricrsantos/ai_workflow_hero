  Authoritative C15 sources: PRD-C15-001 §§1–14, UI-C15-001 §§1–16, and ADR-083–090.
  Idea notes yield on divergence. Go validates and transitions structured state; agents emit JSON only.
  Browser UI Validation and QA End-to-End are disabled for this cycle, but the SDD still specifies their
  report/handoff contracts so later-enabled stages use the same atomic path. Scope is native=true → generic_agent.

  Planning decisions locked for this change:
    - Schema v11 is forward-only from v10; never recreate hero.db.
    - Fingerprint is SHA-256 of NFC + whitespace-collapsed file/requirement/acceptance with cycle, source, owner.
    - Failed validation close, finding writes, and loop-back share one Store transaction; CLI never nests tx.
    - Projection uses recoverable todo_projection_ops; SQLite and current-state.md are not a distributed transaction.
    - Status JSON additive fields use existing camelCase on StatusView; do not rename current keys.
    - Standalone `hero stage loop-back` stays administrative; agent-driven flow uses atomic `--failed --findings-json`.

  Stack: Go, Cobra, embed.FS, Feature Based + Vertical Slice, Bubble Tea/lipgloss/bubbles, SQLite.
  Test command: `go test ./...`. Active OpenSpec change: `loopback-findings-handoff`.
  Engineering guidance: idiomatic Go, small injectable components, explicit wrapped errors,
  context cancellation, no global mutable state; TUI Update/View never block; real temp SQLite
  and t.TempDir() projections; no live harness accounts.

rules:
  proposal:
    - Reference PRD-C15-001 sections; cite ADR-083–090 and UI-C15-001
    - State in/out of scope; idea notes yield to PRD/UI/ADR
    - Classify CLI versus Runtime work per ADR-003; agents never mutate findings/ToDos/stages
    - Call out atomic failed-close, mixed task-*/find-* assignments, and projection recovery

  specs:
    - Use WHEN/THEN acceptance scenarios with exactly four hashtags for `#### Scenario:`
    - Align with PRD-C15-001, UI-C15-001, ADR-083–090, and existing store/engine/TUI contracts
    - Specify observable lifecycle and diagnostic behavior without prescribing incidental Go internals
    - Mark filesystem, clock, and SQLite as real temporary fixtures

  design:
    - Follow ADR-002, ADR-003, ADR-012, ADR-013, ADR-075, ADR-083–090 and existing vertical-slice boundaries
    - Factor engine/store so one transaction owns failed-close + findings + loop-back
    - Keep OpenSpec authoritative for task-* and SQLite authoritative for find-*/structured ToDos
    - Prefer parallel TUI/Telegram/asset work after service contracts exist

  tasks:
    - Use atomic `- [ ] X.Y [task-id] [agent:generic_agent]` checklist items with PARALLEL/SERIES markers
    - Scope all implementation to native → `generic_agent`; colocate behavior tests; require `go test ./...`
    - Do not start UI/prompt work before stable service contracts; do not mark lifecycle complete before migration/recovery tests
    - Fan out TUI, Telegram, and harness-asset work after the JSON/CLI contracts exist
