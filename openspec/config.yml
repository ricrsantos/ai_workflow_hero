  Authoritative C13 sources: PRD-C13-001 §§1–5, UI-C13-001 §§1–3, and ADR-070–074.
  The idea file yields on divergence. Claude is an opt-in TUI-only harness; Cursor IDE Runtime,
  deterministic workflow stages, existing harness contracts, and two-step fallback remain intact.
  The minimum supported Claude Code CLI is 2.1.261 on Linux/macOS amd64/arm64. Browser UI Validation
  and QA End-to-End are disabled for this cycle. Scope is native=true → generic_agent.

  Required implementation boundaries:
    - Use a turn-scoped supervised `claude -p` subprocess; no Claude daemon, process registry, or orphan reaper.
    - Keep Claude protocol, NDJSON parsing, process supervision, and the temporary permission bridge inside `internal/adapters/claude`.
    - Reuse normalized Hero harness events, permissions, model properties, session binding, Telegram forwarding, and metrics; do not import Telegram types into the adapter.
    - Authentication is diagnosed during execution; never launch login or store credentials/API keys.
    - `ask` must validate the `--permission-prompt-tool` wire contract with a fixture/fake process before main implementation; unsupported ask fails explicitly without downgrade.
    - `.claude/` projection and the marked root `CLAUDE.md` block preserve user content; never copy or invent `AGENTS.md`.

  Stack: Go, Cobra, embed.FS, Feature Based + Vertical Slice, huh + existing Bubble Tea/lipgloss, SQLite (ADR-013).
  Test command: `go test ./...`. Active OpenSpec change: `claude-code-adapter`.
  Engineering guidance: idiomatic Go, small injectable components, explicit wrapped errors, context cancellation,
  no global mutable state; TUI I/O belongs in tea.Cmd, Update never blocks, and constrained layouts use ANSI-aware widths.

rules:
  proposal:
    - Reference PRD-C13-001 sections; cite ADR-070–074 and UI-C13-001
    - State in/out of scope; idea file yields to PRD/UI/ADR; Cursor IDE Runtime remains unchanged
    - Classify CLI versus TUI/runtime work per ADR-003 and preserve two-step fallback
    - Call out minimum CLI/version, no auth storage, SIGINT-first cancellation, no daemon, and marked CLAUDE.md ownership

  specs:
    - Use WHEN/THEN acceptance scenarios with exactly four hashtags for `#### Scenario:`
    - Align with PRD-C13-001, UI-C13-001, ADR-070–074, and existing normalized harness contracts
    - Specify observable protocol/error/security behavior without prescribing Go internals
    - Mark process, clock, filesystem, protocol, TUI decision, and model catalog dependencies as injectable/test fixtures where relevant

  design:
    - Follow ADR-002, ADR-003, ADR-070–074 and existing OpenCode/Codex adapter boundaries
    - Keep protocol parsing, process groups, cancellation, and the temporary permission bridge adapter-local
    - Make NDJSON reading and all TUI/external-process I/O asynchronous; preserve final-result repair and activity-aware watchdog behavior
    - Separate `.claude/` projection/checksum/CLAUDE.md ownership from execution and preserve user files

  tasks:
    - Use atomic `- [ ] X.Y` checklist items, cite spec/PRD/ADR/UI traceability, and mark every group PARALLEL or SERIES
    - Scope all implementation to native → `generic_agent`; colocate behavior tests in each touched package; require `go test ./...`
    - Make the permission protocol spike the first series task; fan out adapter internals, projection, catalog, CLI state, and TUI surfaces only after their contracts are available
