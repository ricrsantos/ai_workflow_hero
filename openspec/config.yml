  Terminology: **etapa** = workflow stage; **interação** = one conversational round within an etapa;
  **enabled** = user selected harness in hero.json; **available** = adapter IsAvailable true;
  **native model id** = harness-specific model string (Cursor slug, OpenCode provider/model, Codex native id).

  Behavioral template: `internal/adapters/opencode/` (OpenCodeAdapter wins over idea file on divergence).
  Do not invent requirements. Preserve C4/C5 Cursor/OpenCode behavior, Cursor IDE Runtime, checksum upgrade,
  dual-entry, lazy harness boot, C5 model properties, and deterministic engine. No hero serve daemon.
  Scope: native=true (generic_agent). Browser UI Validation and QA End-to-End are disabled for C6.

  Stack: Go, Cobra, embed.FS, Feature Based + Vertical Slice, huh + Bubble Tea, SQLite (ADR-013).
  Test command: `go test ./...`. Active OpenSpec change: `codex-adapter`.

rules:
  proposal:
    - Reference PRD-C06-001 sections; cite ADR-043–048 and UI-C06-001
    - State in/out of scope; OpenCodeAdapter is the behavioral spec; idea file yields on divergence
    - Classify CLI vs Runtime per ADR-003; Cursor IDE stays Cursor-only (ADR-043)
    - Include dedicated Codex model catalog and `.codex/` projection tasks

  specs:
    - Use WHEN/THEN acceptance scenarios (exactly 4 hashtags for `#### Scenario:`)
    - Align with PRD-C06-001, UI-C06-001, and ADR-043–048

  design:
    - Follow ADR-002, ADR-003, ADR-043–048; Codex JSON-RPC stays inside `internal/adapters/codex`

  tasks:
    - Atomic checklist; `go test ./...`; mark PARALLEL vs SERIES
    - Scope native → generic_agent; colocated _test.go per package touched
    - Keep Codex catalog/projection work standalone; do not fold into UI-only tasks
