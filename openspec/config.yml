schema: spec-driven

context: |
  Project: AI Workflow Hero (Hero) — the Hero CLI + Runtime assets themselves.
  This is Hero's own source code repository, not a project that consumes Hero.
  Phase: Cycle C6 — Codex Adapter (Hero 2.5.0).

  Authoritative baseline sources — read before planning or writing any artifact:
    - AGENTS.md (project summary, doc map, reference lookup order, testing loop, ambiguity policy)
    - docs/product/PRD.md (baseline index; cycle PRDs supersede on conflict)
    - docs/architecture/ADR.md (architecture index and schemas; cycle ADRs linked)
    - docs/product/UI.md (CLI/TUI visual conventions index)
    - docs/deployment/DEPLOY.md (build, release, and distribution)
    - docs/testing/TESTING.md (testing strategy and `go test ./...`)
    - context/current-state.md (current implementation status and architecture summary)
    - context/context-log.md (recent decisions and session history)

  Registered documents below are generated from `.workflow-hero/config/documents.json`.
  The registry is the source of truth for the cycle-document list; do not hand-maintain it here:
    - [C01 PRD] docs/product/PRD-C01-001-hero-1-0.md — Hero 1.0: Harness Orchestrator, AI Loop, TUI & SQLite
