    - [C02 UI] docs/product/UI-C02-001-tui-slash-command-parity.md — TUI Slash Command Parity & Imported Commands
    - [C03 PRD] docs/product/PRD-C03-001-cursor-harness-tui-autonomy.md — Cursor Harness Autonomy & TUI Orchestration
    - [C03 ADR] docs/architecture/ADR-C03-001-cursor-harness-tui-autonomy.md — Cursor Harness Autonomy & TUI Orchestration (ADR-024–029)
