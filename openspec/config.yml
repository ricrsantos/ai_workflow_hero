schema: spec-driven

context: |
  Project: AI Workflow Hero (Hero) — the Hero CLI + Runtime assets themselves.
  This is Hero's own source code repository, not a project that consumes Hero.
  Phase: V1 design complete (70+ grilling decisions resolved); no Go code written yet.

  Authoritative sources — read before planning or writing any artifact:
    - AGENTS.md (project summary, doc map, reference lookup order, testing loop, ambiguity policy)
    - docs/product/PRD.md (goals, scope, functional/non-functional requirements, V1/V2 boundaries)
    - docs/product/UI.md (CLI terminal UX: colors/icons, output formats, prompts, error format)
    - docs/architecture/ADR.md (ADR-001 through ADR-011, plus the Appendix with hero.json/project.json/
      documents.json/workflow-config.yml/models schemas)
    - docs/deployment/DEPLOY.md (target platforms, build/release process, versioning, checksums)
    - context/current-state.md (current implementation status, architecture summary, pending features)
    - context/context-log.md (recent decisions and session history)
    - docs/idea/ai_workflow_hero.md (full design discussion, source of the decisions above)

  Do not invent requirements. If any of the documents above are silent or ambiguous on a topic,
  ask the user before proceeding — do not assume a default (see AGENTS.md § Ambiguity and Missing
  Information).

  Stack: Go, Cobra (CLI), Go `embed.FS` (asset embedding), Feature Based + Vertical Slice
  architecture (internal/<feature>/ packages), survey-style interactive prompts. Target platforms
  (V1): Linux and macOS, amd64 and arm64. No Node/npm involved — test command is `go test ./...`.

rules:
  proposal:
    - Reference PRD sections by number (e.g. "PRD §5.3")
    - State what is in scope vs. out of scope for this change
    - Classify the change as CLI (deterministic, internal/<feature>/) or Runtime (agent/skill/command
      asset) per ADR-003; a change should not silently mix both without calling this out
    - List which new/modified capabilities require a corresponding internal/<feature>/ package

  specs:
    - Use WHEN/THEN acceptance scenarios (exactly 4 hashtags for `#### Scenario:`)
    - Align capabilities with PRD acceptance criteria and ADR constraints
    - For CLI-facing behavior, cross-reference the relevant UI.md convention (icons, `--json`,
      error format, non-interactive flags)

  design:
    - Follow ADR-002 (Feature Based + Vertical Slice), ADR-003 (CLI vs. Runtime separation),
      ADR-006 (simple placeholder templating, no loop engine)
    - Call out which ADR(s) the design extends or, if none fit, note that a new ADR is needed
    - Reference the Appendix schemas in ADR.md for any file format the design touches
      (hero.json / project.json / documents.json / workflow-config.yml / models/*.yml)

  tasks:
    - Atomic, ordered checklist; include `go test ./...` as a task where relevant (see ADR-009)
    - Mark which tasks can run in parallel vs. must run in series, and prefer delegating
      implementation tasks to subagents via the Task tool when applicable (see ADR-005)
    - Every task group touching `internal/<feature>/` must include a colocated `_test.go` task
